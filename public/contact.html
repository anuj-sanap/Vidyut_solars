  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Contact Vidyut PowerTech for solar panel installation in Nashik. Get a free quote and site visit." />
    <meta name="keywords" content="Solar panel installation in Nashik, Best solar service in Nashik, Solar rooftop Nashik" />
    <link rel="canonical" href="https://vidyutsolar.in/contact.html" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Contact Vidyut PowerTech | Nashik" />
    <meta property="og:description" content="Book your free site visit and get a custom rooftop solar quote for your property in Nashik." />
    <meta property="og:url" content="https://vidyutsolar.in/contact.html" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1509391366360-2e959784a276?auto=format&fit=crop&w=1800&q=80" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Contact Vidyut PowerTech | Nashik" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="contact" class="bg-background font-sans text-foreground">
    <div id="navbar-root"></div>

    <main class="mx-auto max-w-7xl px-4 py-14 md:px-6">
      <h1 class="font-display text-4xl text-foreground md:text-5xl" data-reveal>Contact Us</h1>
      <p class="mt-3 max-w-3xl text-sm leading-relaxed text-muted-foreground" data-reveal>Get a free site visit and custom solar estimate for your property. Our team usually responds within 30 minutes during business hours.</p>

      <section class="mt-8 grid gap-8 md:grid-cols-2">
        <div class="theme-card-shadow" data-reveal>
          <h2 class="font-display text-xl text-foreground">Lead Capture Form</h2>
          <form class="lead-form mt-4">
            <input type="hidden" name="source" value="contact-page" />
            <div class="grid gap-4">
              <label class="text-sm font-medium text-foreground" for="contact-name">Full Name</label>
              <input id="contact-name" name="name" required autocomplete="name" placeholder="Name" class="input-field" />
              <label class="text-sm font-medium text-foreground" for="contact-phone">Phone Number</label>
              <input id="contact-phone" name="phone" type="tel" inputmode="numeric" pattern="^[0-9]{10}$" maxlength="10" required placeholder="10-digit phone number" class="input-field" />
              <label class="text-sm font-medium text-foreground" for="contact-location">Location</label>
              <input id="contact-location" name="location" required placeholder="Location (Nashik / nearby area)" class="input-field" />
              <label class="text-sm font-medium text-foreground" for="contact-plot">Plot Size (sq ft)</label>
              <input id="contact-plot" name="plotSize" type="number" min="100" required placeholder="Plot Size (important for estimation)" class="input-field" />
              <label class="text-sm font-medium text-foreground" for="contact-bill">Monthly Electricity Bill (optional)</label>
              <input id="contact-bill" name="electricityBill" type="number" min="0" placeholder="Electricity Bill (optional)" class="input-field" />
              <button type="submit" class="btn-primary w-full">Get Free Quote</button>
              <p class="form-status text-sm"></p>
            </div>
          </form>
        </div>

        <div class="space-y-5">
          <div class="theme-card-shadow" data-reveal>
            <h3 class="font-display text-lg text-foreground">Direct Contact</h3>
            <p class="mt-2 text-sm text-muted-foreground">Talk directly with our Nashik solar team for quick guidance.</p>
            <div class="mt-3 flex flex-col gap-3 text-sm">
              <a href="tel:+917558200928" class="btn-primary text-center">Call Now</a>
              <a href="https://wa.me/917558200928?text=Hi%20Vidyut%20PowerTech%2C%20I%20want%20a%20solar%20installation%20quote%20in%20Nashik" target="_blank" rel="noopener" class="btn-secondary text-center">WhatsApp</a>
            </div>
          </div>
          <div class="theme-card-shadow" data-reveal>
            <h3 class="font-display text-lg text-foreground">Service Area Map</h3>
            <iframe
              title="Nashik service area map"
              class="mt-4 h-72 w-full rounded-lg border border-border"
              loading="lazy"
              src="https://www.google.com/maps?q=Nashik%20Maharashtra&output=embed"
            ></iframe>
          </div>
        </div>
      </section>
    </main>

    <div id="footer-root"></div>
    <div id="whatsapp-root"></div>
    <script src="/js/main.js"></script>
    <script src="/js/form.js"></script>
  </body>
</html>
