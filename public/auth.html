<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Vidyut PowerTech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body data-page="auth" class="bg-background font-sans text-foreground">
    <div id="navbar-root"></div>

    <main class="mx-auto grid min-h-[70vh] max-w-5xl items-start gap-6 px-4 py-12 md:grid-cols-2 md:px-6">
      <section class="theme-card-shadow" data-reveal>
        <h1 class="font-display text-2xl text-foreground">Login</h1>
        <form id="loginForm" class="mt-5 grid gap-4">
          <label class="text-sm font-medium text-foreground" for="loginEmail">Email</label>
          <input id="loginEmail" name="email" type="email" required class="input-field" />
          <label class="text-sm font-medium text-foreground" for="loginPassword">Password</label>
          <input id="loginPassword" name="password" type="password" required class="input-field" />
          <label id="ownerKeyWrap" class="hidden text-sm font-medium text-foreground" for="ownerKey">Owner Key</label>
          <input id="ownerKey" name="ownerKey" type="password" class="input-field hidden" />
          <button type="submit" class="btn-primary w-full">Login</button>
          <p id="loginStatus" class="text-sm" aria-live="polite"></p>
        </form>
      </section>

      <section id="registerPanel" class="theme-card-shadow" data-reveal>
        <h2 class="font-display text-2xl text-foreground">Register</h2>
        <form id="registerForm" class="mt-5 grid gap-4">
          <label class="text-sm font-medium text-foreground" for="registerName">Name</label>
          <input id="registerName" name="name" type="text" required class="input-field" />
          <label class="text-sm font-medium text-foreground" for="registerEmail">Email</label>
          <input id="registerEmail" name="email" type="email" required class="input-field" />
          <label class="text-sm font-medium text-foreground" for="registerPassword">Password</label>
          <input id="registerPassword" name="password" type="password" minlength="8" required class="input-field" />
          <button type="submit" class="btn-primary w-full">Create Account</button>
          <p id="registerStatus" class="text-sm" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <div id="footer-root"></div>
    <script src="/js/auth-client.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
